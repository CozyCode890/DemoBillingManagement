# ---------------------------------------------------------------
# Sửa file này cho khớp với MySQL trên máy bạn, rồi chạy lại app.
# KHÔNG cần biên dịch lại Java.
# ---------------------------------------------------------------

# localhost      = MySQL chạy trên chính máy này
# 3306           = cổng mặc định của MySQL
# retail_billing = tên database (do file 01_schema.sql tạo ra)
db.url=jdbc:mysql://localhost:3306/retail_billing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8

db.user=root

# Điền mật khẩu root MySQL của bạn vào đây.
# Bản MySQL portable tôi đã cài sẵn cho bạn dùng mật khẩu là: root
db.password=root

# ---------------------------------------------------------------
# Cấu hình lớp Main khởi chạy của Java (cho run.ps1 và GUI Setup App)
# Mặc định là billing.Main nếu để trống
# ---------------------------------------------------------------
app.main.class=billing.Main

# ---------------------------------------------------------------
# ĐĂNG NHẬP NHANH -- chỉ dành cho bản demo / lúc học
# Đặc tả đầy đủ: plan/11-KE-HOACH-KHOI-2-DANG-NHAP-NHANH.md mục 3
# ---------------------------------------------------------------

# Bật hàng nút "Đăng nhập nhanh" trên màn hình đăng nhập.
# Đặt false: màn hình đăng nhập trở về đúng như trước khối 2 (chỉ gõ tay),
#            auto-login và tham số --login cũng bị vô hiệu luôn.
quick.login.enabled=true

# Danh sách tài khoản của hàng nút nhanh, các mục cách nhau bằng dấu PHẨY.
# Cú pháp một mục:   <username>:<password>[:<nhãn hiển thị>]
# Dấu , tách mục, dấu : tách trường (cắt tối đa 3 phần). Nên mật khẩu có chứa
# dấu , hoặc : thì KHÔNG biểu diễn được ở đây -- tài khoản đó phải gõ tay.
# Mục sai cú pháp bị bỏ qua kèm một dòng cảnh báo ra console, các mục còn lại
# vẫn dùng được.
#
# CẢNH BÁO: đây là mật khẩu để NGUYÊN VĂN trong file cấu hình đã được commit.
#   Chỉ điền 2 tài khoản mẫu mà sql/02_seed.sql tạo ra.
#   TUYỆT ĐỐI không điền tài khoản thật. Dự án thật thì đặt quick.login.enabled=false
#   và gitignore cả config.properties (xem hướng dẫn ở .gitignore dòng 26-30).
quick.login.accounts=cashier:cashier:Thu ngan,manager:manager:Quan ly

# Tự động đăng nhập bằng username này, BỎ QUA HẲN màn hình đăng nhập.
# Để TRỐNG (mặc định) = luôn hiện màn hình đăng nhập.
# Username điền ở đây phải có trong quick.login.accounts (vì cần mật khẩu).
# Tham số dòng lệnh --login=<username> thắng khoá này.
quick.login.auto=

# Nhớ tên đăng nhập lần trước để điền sẵn vào ô username.
# KHÔNG BAO GIỜ nhớ mật khẩu -- xem plan/11 mục 2.3.
quick.login.remember=true
