# ---------------------------------------------------------------
# Cấu hình chung của cả nhóm -- thường KHÔNG cần sửa: Setup App tự bật
# MySQL (hoặc dùng MySQL có sẵn) với đúng tài khoản ghi ở dưới.
# Sửa xong chỉ cần bấm CHẠY lại, KHÔNG cần biên dịch lại Java.
# ---------------------------------------------------------------

# localhost      = MySQL chạy trên chính máy này
# 3306           = cổng mặc định của MySQL
# retail_billing = tên database (do file 01_schema.sql tạo ra)
db.url=jdbc:mysql://localhost:3306/retail_billing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8

db.user=root

# MySQL riêng của Setup App luôn được đặt đúng mật khẩu này. Máy bạn có MySQL
# khác mật khẩu? Xem README mục "Máy đã có MySQL riêng" -- ĐỪNG sửa rồi commit
# dòng này, mật khẩu máy bạn sẽ đi theo sang máy cả nhóm.
db.password=root

# File SQL dựng database và THỨ TỰ nạp (tên file trong sql/, cách nhau dấu phẩy).
# Setup App băm nội dung các file này: khác lần nạp trước (đổi nhánh, sửa seed)
# là tự xoá + nạp lại khi bấm CHẠY. Để comment = mặc định dưới đây (file nào
# không có thì bỏ qua). Nhánh thêm file SQL mới thì bỏ dấu # và liệt kê vào.
# db.build.files=01_schema.sql, 04_routines.sql, 02_seed.sql, 05_invariants.sql

# ---------------------------------------------------------------
# Lớp Main của app billing (Setup App chạy lớp này)
# Mặc định là billing.Main nếu để trống. App gọn (src/billing2): billing2.Main
# ---------------------------------------------------------------
app.main.class=billing.Main

# ---------------------------------------------------------------
# MÃ QR THANH TOÁN (VietQR / Napas 247) -- tab 1 Lập hóa đơn
# Đặc tả: docs/plan/14-KE-HOACH-KHOI-5-UI-TAB-LAP-HOA-DON.md mục 5.6f
#
# Sửa 4 khóa dưới đây rồi chạy lại app là mã QR trỏ sang tài khoản mới --
# KHÔNG cần biên dịch lại. Xóa cả 4 khóa thì app dùng giá trị mặc định
# ghi trong VietQRHelper, không báo lỗi.
# ---------------------------------------------------------------

# Bật nút "Tao ma QR" ở khung 4. Đặt false thì nút ẨN HẲN (không phải mờ):
# một nút bị khóa mà không giải thích được gì thì người dùng cứ bấm tiếp.
qr.enabled=true

# Mã BIN của ngân hàng theo chuẩn Napas. 970422 = MB Bank.
# Tra bảng BIN: https://api.vietqr.io/v2/banks
qr.bank.bin=970422

# Số tài khoản nhận tiền.
# CẢNH BÁO: đây là file cấu hình ĐÃ ĐƯỢC COMMIT. Đừng điền tài khoản thật
# của bạn vào đây nếu repo này công khai.
qr.account.no=90902241107

# Tên chủ tài khoản -- chỉ để HIỆN trên hộp thoại ("Chuyen toi: ..."),
# không đi vào payload QR. Để trống thì hộp thoại không hiện dòng đó.
qr.account.name=CHUNG HOC HAO
